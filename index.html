    <style>
        :root {
            --bg-base: #1a1a2e;
            --bg-light: #16213e;
            --bg-accent: #0f3460;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-white-strong: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --accent-blue: #4a9eff;
            --accent-purple: #9d4edd;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --accent-gold: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .orb-blue {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74, 158, 255, 0.4), transparent 70%);
            top: -100px;
            left: -100px;
        }

        .orb-purple {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.35), transparent 70%);
            bottom: -50px;
            right: -50px;
            animation-delay: -3s;
        }

        .orb-cyan {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3), transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .glass {
            background: var(--glass-white);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 var(--glass-shadow);
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .glass:hover {
            background: var(--glass-white-strong);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.2),
                0 0 60px rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .text-shine {
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ff 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textShimmer 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .btn-glass {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-glass:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: rgba(74, 158, 255, 0.3);
            border-color: rgba(74, 158, 255, 0.5);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(74, 158, 255, 0.5);
            box-shadow: 0 0 40px rgba(74, 158, 255, 0.5);
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.3);
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .btn-success:hover {
            background: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
        }

        .btn-outline {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-outline:hover {
            background: var(--glass-white);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-danger {
            background: rgba(255, 68, 68, 0.3);
            border-color: rgba(255, 68, 68, 0.5);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 26, 46, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .navbar-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

            position: relative;
            z-index
