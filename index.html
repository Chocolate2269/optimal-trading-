<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Trading - Shining Premium Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --optimal-primary: #6366f1;
            --optimal-secondary: #8b5cf6;
            --optimal-accent: #06b6d4;
            --optimal-success: #10b981;
            --optimal-danger: #ef4444;
            --optimal-gold: #fbbf24;
            --glass-bg: rgba(15, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-display: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-display);
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* ============ SPARKLE BACKGROUND ============ */
        .sparkle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* ============ GLOWING ORBS ============ */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 1;
            animation: orbGlow 4s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.6), transparent);
            top: -150px;
            left: -150px;
        }
        
        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.5), transparent);
            bottom: -100px;
            right: -100px;
            animation-delay: -1s;
        }
        
        .orb-3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4), transparent);
            top: 40%;
            left: 40%;
            animation-delay: -2s;
        }
        
        @keyframes orbGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

            background: linear-gradient(135deg,
