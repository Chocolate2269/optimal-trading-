<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Trading - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-base: #1a1a2e;
            --bg-light: #16213e;
            --bg-accent: #0f3460;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-white-strong: rgba(255, 255, 255, 0.28);
            --glass-border: rgba(255, 255, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --accent-blue: #4a9eff;
            --accent-purple: #9d4edd;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --accent-gold: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 1;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .orb-blue {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 158, 255, 0.5), transparent 70%);
            top: -150px;
            left: -150px;
        }

        .orb-purple {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.45), transparent 70%);
            bottom: -100px;
            right: -100px;
            animation-delay: -2s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .glass {
            background: var(--glass-white);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .glass:hover {
            background: var(--glass-white-strong);
            border-color: rgba(255, 255, 255, 0.55);
        }

        .glass-shine {
            position: relative;
            overflow: hidden;
        }

        .glass-shine::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            animation: shineSweep 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shineSweep {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .text-shine {
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ff 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textShimmer 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .btn-glass {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-glass:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: rgba(74, 158, 255, 0.35);
            border-color: rgba(74, 158, 255, 0.6);
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.35);
            border-color: rgba(0, 255, 136, 0.6);
        }

        .btn-danger {
            background: rgba(255, 68, 68, 0.35);
            border-color: rgba(255, 68, 68, 0.6);
        }
