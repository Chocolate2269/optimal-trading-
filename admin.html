<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Trading - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --glass: rgba(255,255,255,0.15); --border: rgba(255,255,255,0.35); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff; min-height: 100vh; padding: 20px;
        }
        .glass {
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .header { padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .title { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #fff, #ffd700, #fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 3s linear infinite; }
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .btn {
            padding: 10px 20px; border-radius: 10px; font-weight: 600;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 12px; text-transform: uppercase;
            background: rgba(74,158,255,0.35); transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-green { background: rgba(0,255,136,0.35); }
        .btn-red { background: rgba(255,68,68,0.35); }
        .btn-outline { background: transparent; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat { padding: 20px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: 800; }
        .stat-lbl { font-size: 10px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        .table-wrap { padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        th { background: rgba(255,255,255,0.1); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background: rgba(255,255,255,0.05); }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .badge-admin { background: rgba(255,170,0,0.3); color: #ffd700; }
        .badge-user { background: rgba(74,158,255,0.3); color: #a8d8ff; }
        .loading { text-align: center; padding: 40px; color: #a0a0b0; }
        .spinner {
            display: inline-block; width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #4a9eff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 16px 24px;
            border-radius: 12px; background: rgba(30,30,50,0.95);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 2000; display: none;
        }
        .error-box { background: rgba(255,68,68,0.2); border: 1px solid #ff4444; padding: 20px; border-radius: 12px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="glass header">
        <div class="title">👑 OPTIMAL ADMIN</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="location.href='index.html'">🏠 Home</button>
            <button class="btn btn-outline" onclick="location.href='dashboard.html'">📊 Dashboard</button>
            <button class="btn btn-red" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div id="loadingBox" class="glass loading">
        <div class="spinner"></div>
        <div>Connecting to Firebase...</div>
        <div style="font-size: 12px; margin-top: 10px;">Please wait</div>
    </div>
    
    <div id="errorBox" style="display:none;"></div>
    
    <div id="mainPanel" style="display:none;">
        <div class="stats">
            <div class="glass stat"><div class="stat-val" id="totalUsers" style="color:#4a9eff;">0</div><div class="stat-lbl">Total Users</div></div>
            <div class="glass stat"><div class="stat-val" id="totalBalance" style="color:#00ff88;">$0.00</div><div class="stat-lbl">Total Balance</div></div>
            <div class="glass stat"><div class="stat-val" id="totalCountries" style="color:#9d4edd;">0</div><div class="stat-lbl">Countries</div></div>
            <div class="glass stat"><div class="stat-val" id="todaySignups" style="color:#ffaa00;">0</div><div class="stat-lbl">Today's Signups</div></div>
        </div>
        
        <div class="glass table-wrap">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                <h2 style="font-size:18px;">🌍 All Users</h2>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <input type="text" id="searchBox" placeholder="🔍 Search..." oninput="filterUsers()" style="padding:8px 14px; border-radius:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:12px;">
                    <button class="btn" onclick="loadUsers()">🔄 Refresh</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>Name</th><th>Email</th><th>Country</th>
                        <th>Balance</th><th>Type</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="7" class="loading"><div class="spinner"></div><div>Loading users...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCGAmwvg6QfEAIth-XQYblRtZ47WSUMppQ",
            authDomain: "optimal-trading.firebaseapp.com",
            projectId: "optimal-trading",
            storageBucket: "optimal-trading.firebasestorage.app",
            messagingSenderId: "180919975679",
            appId: "1:180919975679:web:31a8bf720f08df6d7cd6ca",
            measurementId: "G-4J31RFJK03"
        };
        
        let db, auth;
        let allUsers = [];
        
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
            console.log('✅ Firebase initialized');
        } catch (e) {
            showError('Firebase init failed: ' + e.message);
        }
        
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.display = 'block';
            t.style.borderColor = type === 'success' ? '#00ff88' : '#ff4444';
            t.style.color = type === 'success' ? '#00ff88' : '#ff4444';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        
        function showError(msg) {
            document.getElementById('loadingBox').style.display = 'none';
            const eb = document.getElementById('errorBox');
            eb.style.display = 'block';
            eb.className = 'glass error-box';
            eb.innerHTML = `<h3>⚠️ Error</h3><p style="margin-top:10px;">${msg}</p>
                <div style="margin-top:15px; font-size:12px; color:#ccc;">
                    <strong>Common fixes:</strong><br>
                    1. Check Firestore Rules in Firebase Console<br>
                    2. Make sure you're logged in as admin<br>
                    3. Check browser console (F12) for details
                </div>
                <button class="btn btn-outline" style="margin-top:15px;" onclick="location.reload()">🔄 Retry</button>`;
        }
        
        function showMainPanel() {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }
        
        function countryFlag(code) {
            if (!code || code === 'UN' || code.length !== 2) return '🌍';
            try {
                return String.fromCodePoint(...[...code.toUpperCase()].map(c => 127397 + c.charCodeAt()));
            } catch { return '🌍'; }
        }
        
        // LOAD USERS
        function loadUsers() {
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '<tr><td colspan="7" class="loading"><div class="spinner"></div><div>Loading users...</div></td></tr>';
            
            console.log('📥 Fetching users from Firestore...');
            
            db.collection('users').get()
                .then(snapshot => {
                    console.log('✅ Got', snapshot.size, 'users');
                    
                    allUsers = [];
                    let totalBalance = 0, todaySignups = 0;
                    const countries = new Set();
                    const today = new Date(); today.setHours(0,0,0,0);
                    
                    snapshot.forEach(doc => {
                        const u = doc.data();
                        u.id = doc.id;
                        allUsers.push(u);
                        totalBalance += (u.balance || 0);
                        if (u.country) countries.add(u.country);
                        if (u.createdAt && u.createdAt.toDate) {
                            const c = u.createdAt.toDate();
                            if (c >= today) todaySignups++;
                        }
                    });
                    
                    document.getElementById('totalUsers').textContent = allUsers.length;
                    document.getElementById('totalBalance').textContent = '$' + totalBalance.toFixed(2);
                    document.getElementById('totalCountries').textContent = countries.size;
                    document.getElementById('todaySignups').textContent = todaySignups;
                    
                    renderUsers(allUsers);
                    showMainPanel();
                })
                .catch(err => {
                    console.error('❌ Firestore error:', err);
                    showError('Firestore: ' + err.message);
                });
        }
        
        function renderUsers(users) {
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">No users found yet</td></tr>';
                return;
            }
            
            users.forEach((u, i) => {
                const created = u.createdAt && u.createdAt.toDate ? u.createdAt.toDate().toLocaleString() : 'Just now';
                const flag = countryFlag(u.countryCode);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td><strong>${u.name || '—'}</strong><br><span style="font-size:10px; color:#a0a0b0;">${created}</span></td>
                    <td style="font-size:12px;">${u.email || '—'}</td>
                    <td>${flag} ${u.country || 'Unknown'}</td>
                    <td style="color:#00ff88; font-weight:600;">$${(u.balance||0).toFixed(2)}</td>
                    <td><span class="badge ${u.isAdmin ? 'badge-admin':'badge-user'}">${u.isAdmin?'Admin':'User'}</span></td>
                    <td>
                        <div style="display:flex; gap:4px; flex-wrap:wrap;">
                            <button class="btn btn-green" style="padding:5px 10px; font-size:10px;" onclick="creditUser('${u.id}','${(u.name||'User').replace(/'/g,"")}')">💰 +$</button>
                            <button class="btn btn-red" style="padding:5px 10px; font-size:10px;" onclick="debitUser('${u.id}','${(u.name||'User').replace(/'/g,"")}')">💸 -$</button>
                            <button class="btn btn-outline" style="padding:5px 10px; font-size:10px;" onclick="viewUser('${u.id}')">👁</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function filterUsers() {
            const q = document.getElementById('searchBox').value.toLowerCase();
            if (!q) return renderUsers(allUsers);
            const filtered = allUsers.filter(u =>
                (u.name || '').toLowerCase().includes(q) ||
                (u.email || '').toLowerCase().includes(q) ||
                (u.country || '').toLowerCase().includes(q)
            );
            renderUsers(filtered);
        }
        
        // CREDIT
        function creditUser(uid, name) {
            const amt = prompt(`💰 Credit ${name}\n\nEnter amount to ADD ($):`, '100');
            if (!amt || parseFloat(amt) <= 0) return;
            const amount = parseFloat(amt);
            if (!confirm(`Add $${amount.toFixed(2)} to ${name}?`)) return;
            
            db.collection('users').doc(uid).update({
                balance: firebase.firestore.FieldValue.increment(amount)
            }).then(() => {
                showToast(`✅ $${amount.toFixed(2)} credited to ${name}`);
                loadUsers();
            }).catch(err => showToast(err.message, 'error'));
        }
        
        // DEBIT
        function debitUser(uid, name) {
            const amt = prompt(`💸 Debit ${name}\n\nEnter amount to REMOVE ($):`, '50');
            if (!amt || parseFloat(amt) <= 0) return;
            const amount = parseFloat(amt);
            if (!confirm(`Remove $${amount.toFixed(2)} from ${name}?`)) return;
            
            db.collection('users').doc(uid).update({
                balance: firebase.firestore.FieldValue.increment(-amount)
            }).then(() => {
                showToast(`💸 $${amount.toFixed(2)} debited from ${name}`);
                loadUsers();
            }).catch(err => showToast(err.message, 'error'));
        }
        
        function viewUser(uid) {
            db.collection('users').doc(uid).get().then(doc => {
                if (doc.exists) {
                    const u = doc.data();
                    const flag = countryFlag(u.countryCode);
                    alert(`🌍 USER: ${u.name}
━━━━━━━━━━━━━━━━━━
Email:    ${u.email}
Country:  ${flag} ${u.country || '—'}
City:     ${u.city || '—'}
Browser:  ${u.browser || '—'}
Device:   ${u.device || '—'}
Balance:  $${(u.balance||0).toFixed(2)}
Type:     ${u.isAdmin ? 'Admin' : 'User'}
Joined:   ${u.createdAt && u.createdAt.toDate ? u.createdAt.toDate().toLocaleString() : '—'}`);
                }
            });
        }
        
        function logout() {
            auth.signOut().then(() => location.href = 'index.html');
        }
        
        // ==========================================
        // BOOT SEQUENCE - Load admin automatically
        // ==========================================
        console.log('🚀 Admin panel starting...');
        
        // Wait for Firebase Auth to be ready
        auth.onAuthStateChanged(user => {
            console.log('Auth state:', user ? user.email : 'not logged in');
            
            if (user) {
                // User is logged in - check if admin
                db.collection('users').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists && doc.data().isAdmin) {
                            console.log('✅ Admin confirmed');
                            loadUsers();
                        } else {
                            // Not admin - still show panel but warn
                            console.log('⚠️ Not admin, but loading panel anyway');
                            showToast('You are not admin — read only mode', 'error');
                            loadUsers();
                        }
                    })
                    .catch(err => {
                        console.error('User check failed:', err);
                        showError('Cannot verify admin: ' + err.message);
                    });
            } else {
                // Not logged in - try auto-login as admin
                console.log('Not logged in, trying admin auto-login...');
                const ADMIN_EMAIL = "admin@optimaltrading.com";
                const ADMIN_PASS = "admin123456";
                
                auth.signInWithEmailAndPassword(ADMIN_EMAIL, ADMIN_PASS)
                    .then(cred => {
                        console.log('✅ Auto-logged in as admin');
                        return db.collection('users').doc(cred.user.uid).update({
                            isAdmin: true,
                            accountType: 'admin'
                        }).catch(() => {
                            return db.collection('users').doc(cred.user.uid).set({
                                name: 'Admin',
                                email: ADMIN_EMAIL,
                                balance: 0,
                                accountType: 'admin',
                                isAdmin: true,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    })
                    .then(() => loadUsers())
                    .catch(err => {
                        // Try to create admin
                        console.log('Creating admin account...');
                        auth.createUserWithEmailAndPassword(ADMIN_EMAIL, ADMIN_PASS)
                            .then(cred => db.collection('users').doc(cred.user.uid).set({
                                name: 'Admin',
                                email: ADMIN_EMAIL,
                                balance: 0,
                                accountType: 'admin',
                                isAdmin: true,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            }))
                            .then(() => {
                                showToast('Admin account created!');
                                loadUsers();
                            })
                            .catch(e => showError('Auto-login failed: ' + e.message));
                    });
            }
        });
    </script>
</body>
</html>
