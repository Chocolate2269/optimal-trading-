<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Optimal Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .logo {
    text-align: center; font-size: 22px; font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg,#fff,#a8d8ff,#c4b5fd,#fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: #c0c0d0; font-size: 13px; margin-bottom: 24px; }
  .input-field {
    width: 100%; padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 15px;
    font-family: inherit; margin-bottom: 14px;
  }
  .input-field:focus {
    outline: none;
    border-color: rgba(0,255,136,0.8);
    box-shadow: 0 0 16px rgba(0,255,136,0.35);
  }
  .input-field::placeholder { color: #9090a8; }
  .btn {
    width: 100%; padding: 14px;
    border-radius: 12px; border: 1px solid rgba(0,255,136,0.6);
    background: rgba(0,255,136,0.3);
    color: #fff; font-weight: 700; font-size: 14px;
    letter-spacing: 0.5px; text-transform: uppercase;
    font-family: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; }
  .links { text-align: center; margin-top: 18px; font-size: 13px; }
  .links a { color: #a0a0b8; text-decoration: none; }
  .msg {
    display: none; margin-top: 16px;
    padding: 12px 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.4;
    word-break: break-word;
  }
  .msg.error   { display: block; background: rgba(255,68,68,0.15); border: 1px solid rgba(255,68,68,0.5); color: #ffb3b3; }
  .msg.success { display: block; background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.5); color: #9dffcb; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡ OPTIMAL</div>
    <h1>Create Account</h1>
    <p class="sub">Start in under a minute</p>

    <form id="signupForm">
      <input type="text" id="name" class="input-field" placeholder="Full Name" required autocomplete="name">
      <input type="email" id="email" class="input-field" placeholder="Email" required autocomplete="email">
      <input type="password" id="password" class="input-field" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="new-password">
      <input type="password" id="confirm" class="input-field" placeholder="Confirm Password" required minlength="6" autocomplete="new-password">
      <button type="submit" id="submitBtn" class="btn">Sign Up</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      <a href="login.html">Already have an account? Log in</a>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCGAmwvg6QfEAIth-XQYblRtZ47WSUMppQ",
    authDomain: "optimal-trading.firebaseapp.com",
    projectId: "optimal-trading",
    storageBucket: "optimal-trading.firebasestorage.app",
    messagingSenderId: "180919975679",
    appId: "1:180919975679:web:31a8bf720f08df6d7cd6ca"
  };

  const msgBox = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  const ERRORS = {
    'auth/email-already-in-use': 'That email is already registered. Try logging in.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/network-request-failed': 'Network error. Check your connection.',
    'auth/operation-not-allowed': 'Email sign-up is disabled in Firebase. Enable it in the console.'
  };

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      msgBox.className = 'msg';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showMsg('Passwords do not match.', 'error');
        return;
      }
      if (password.length < 6) {
        showMsg('Password must be at least 6 characters.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      auth.createUserWithEmailAndPassword(email, password)
        .then(cred => {
          // Save the profile in the background — don't let it block login
          db.collection('users').doc(cred.user.uid).set({
            name: name,
            email: email,
            balance: 0,
            accountType: 'user',
            isAdmin: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(err => {
            console.warn('Profile save failed:', err.code, err.message);
          });

          // Wait for session to persist, then redirect
          return cred.user.getIdToken();
        })
        .then(() => {
          window.location.replace('dashboard.html');
        })
        .catch(err => {
          showMsg(ERRORS[err.code] || ('Error: ' + err.code + ' — ' + err.message), 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign Up';
        });
    });

  } catch (e) {
    showMsg('Script crash: ' + e.message, 'error');
  }
</script>
</body>
</html>
