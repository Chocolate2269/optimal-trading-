<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Optimal Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .logo {
    text-align: center; font-size: 22px; font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg,#fff,#a8d8ff,#c4b5fd,#fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: #c0c0d0; font-size: 13px; margin-bottom: 24px; }
  .input-field {
    width: 100%; padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 15px;
    font-family: inherit; margin-bottom: 14px;
  }
  .input-field:focus {
    outline: none;
    border-color: rgba(74,158,255,0.8);
    box-shadow: 0 0 16px rgba(74,158,255,0.35);
  }
  .input-field::placeholder { color: #9090a8; }
  .btn {
    width: 100%; padding: 14px;
    border-radius: 12px; border: 1px solid rgba(74,158,255,0.6);
    background: rgba(74,158,255,0.35);
    color: #fff; font-weight: 700; font-size: 14px;
    letter-spacing: 0.5px; text-transform: uppercase;
    font-family: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; }
  .links {
    display: flex; justify-content: space-between;
    margin-top: 18px; font-size: 13px;
  }
  .links a { color: #a0a0b8; text-decoration: none; }
  .msg {
    display: none; margin-top: 16px;
    padding: 12px 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.4;
    word-break: break-word;
  }
  .msg.error   { display: block; background: rgba(255,68,68,0.15); border: 1px solid rgba(255,68,68,0.5); color: #ffb3b3; }
  .msg.success { display: block; background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.5); color: #9dffcb; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡ OPTIMAL</div>
    <h1>Welcome Back</h1>
    <p class="sub">Log in to your account</p>

    <form id="loginForm">
      <input type="email" id="email" class="input-field" placeholder="Email" required autocomplete="email">
      <input type="password" id="password" class="input-field" placeholder="Password" required autocomplete="current-password">
      <button type="submit" id="submitBtn" class="btn">Login</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      <a href="#" id="forgotLink">Forgot password?</a>
      <a href="signup.html">Create account</a>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCGAmwvg6QfEAIth-XQYblRtZ47WSUMppQ",
    authDomain: "optimal-trading.firebaseapp.com",
    projectId: "optimal-trading",
    storageBucket: "optimal-trading.firebasestorage.app",
    messagingSenderId: "180919975679",
    appId: "1:180919975679:web:31a8bf720f08df6d7cd6ca"
  };

  const msgBox = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  const ERRORS = {
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/network-request-failed': 'Network error. Check your connection.',
    'auth/operation-not-allowed': 'Email login is disabled in Firebase. Enable it in the console.'
  };

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // If already logged in, skip to dashboard
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace('dashboard.html');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      msgBox.className = 'msg';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      auth.signInWithEmailAndPassword(email, password)
        .then(cred => cred.user.getIdToken())
        .then(() => {
          window.location.replace('dashboard.html');
        })
        .catch(err => {
          showMsg(ERRORS[err.code] || ('Error: ' + err.code + ' — ' + err.message), 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        });
    });

    document.getElementById('forgotLink').addEventListener('click', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showMsg('Enter your email above first.', 'error'); return; }

      auth.sendPasswordResetEmail(email)
        .then(() => showMsg('Password reset email sent. Check your inbox.', 'success'))
        .catch(err => showMsg(ERRORS[err.code] || ('Error: ' + err.message), 'error'));
    });

  } catch (e) {
    showMsg('Script crash: ' + e.message, 'error');
  }
</script>
</body>
</html>
