<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  body {
    font-family: sans-serif;
    background: #16213e; color: #fff;
    padding: 20px; margin: 0;
  }
  .card {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 16px; padding: 20px;
    max-width: 500px; margin: 40px auto;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
  .label { color: #a0a0b0; }
  .value { font-weight: 600; text-align: right; word-break: break-all; }
  #log {
    margin-top: 16px; padding: 12px;
    background: #000; color: #0f0;
    font-family: monospace; font-size: 12px;
    border-radius: 8px; white-space: pre-wrap;
    word-break: break-all; min-height: 60px;
  }
  button {
    margin-top: 16px; width: 100%; padding: 12px;
    border-radius: 10px; border: none;
    background: #ff4444; color: #fff;
    font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Dashboard</h1>
    <div class="row"><span class="label">Email</span><span class="value" id="vEmail">…</span></div>
    <div class="row"><span class="label">Name</span><span class="value" id="vName">…</span></div>
    <div class="row"><span class="label">UID</span><span class="value" id="vUid">…</span></div>
    <div id="log">Starting…</div>
    <button onclick="logout()">Logout</button>
  </div>

<script>
  const logEl = document.getElementById('log');
  function log(msg) { logEl.textContent += '\n' + msg; }
  logEl.textContent = 'Starting...';

  try {
    const firebaseConfig = {
      apiKey: "AIzaSyCGAmwvg6QfEAIth-XQYblRtZ47WSUMppQ",
      authDomain: "optimal-trading.firebaseapp.com",
      projectId: "optimal-trading",
      storageBucket: "optimal-trading.firebasestorage.app",
      messagingSenderId: "180919975679",
      appId: "1:180919975679:web:31a8bf720f08df6d7cd6ca"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      log('✓ Firebase init OK');
    } else {
      log('✓ Firebase already init');
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (!user) {
        log('✗ No user — redirecting to login');
        setTimeout(() => { location.href = 'login.html'; }, 1500);
        return;
      }

      log('✓ Logged in: ' + user.email);
      document.getElementById('vEmail').textContent = user.email || '—';
      document.getElementById('vUid').textContent = user.uid;

      db.collection('users').doc(user.uid).get()
        .then(doc => {
          if (doc.exists) {
            const d = doc.data();
            document.getElementById('vName').textContent = d.name || '—';
            log('✓ Firestore profile loaded');
          } else {
            document.getElementById('vName').textContent = '(none)';
            log('⚠ No Firestore doc for this user');
          }
        })
        .catch(err => {
          document.getElementById('vName').textContent = '(error)';
          log('✗ Firestore: ' + err.code + ' — ' + err.message);
        });
    });
  } catch (e) {
    log('✗ CRASH: ' + e.message);
  }

  function logout() {
    firebase.auth().signOut().then(() => { location.href = 'index.html'; });
  }
</script>
</body>
</html>
